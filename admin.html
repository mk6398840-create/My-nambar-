<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Spin & Result Board</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
• { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
body { background: #070b19; color: #fff; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }

.card {
background: rgba(22, 31, 56, 0.7);
backdrop-filter: blur(10px);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 20px;
width: 100%;
max-width: 400px;
padding: 24px;
margin-bottom: 20px;
text-align: center;
box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* Spin Wheel Section */
.wheel-wrapper { position: relative; width: 260px; height: 260px; margin: 20px auto; }
.pointer {
position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
width: 0; height: 0;
border-left: 14px solid transparent; border-right: 14px solid transparent;
border-top: 25px solid #ff3366; z-index: 20;
filter: drop-shadow(0 2px 5px rgba(255,51,102,0.8));
}
.wheel {
width: 100%; height: 100%; border-radius: 50%;
border: 6px solid #1e293b;
position: relative;
transition: transform 5s cubic-bezier(0.15, 0.9, 0.15, 1);
box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
overflow: hidden;
}

/* Numbers inside Wheel /
.slice {
position: absolute; width: 50%; height: 50%;
transform-origin: 100% 100%;
display: flex; align-items: center; justify-content: center;
}
.num-text {
position: absolute; left: 35%; top: 20%;
font-size: 20px; font-weight: bold; color: #fff;
text-shadow: 0 2px 4px rgba(0,0,0,0.8);
transform: rotate(72deg); / Center alignment for slice */
}

/* Timer & Stats */
.timer-card { background: rgba(15, 23, 42, 0.6); border-radius: 12px; padding: 12px; margin-top: 15px; }
.timer-label { font-size: 14px; color: #94a3b8; }
.timer-display { font-size: 24px; font-weight: 700; color: #38bdf8; font-family: monospace; }

.test-btn {
background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border: none;
padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: bold;
cursor: pointer; margin-top: 15px; transition: 0.3s; width: 100%;
}
.test-btn:hover { opacity: 0.9; transform: translateY(-1px); }

/* History Table */
h2 { font-size: 18px; color: #38bdf8; margin-bottom: 15px; text-align: left; display: flex; align-items: center; gap: 8px; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { padding: 12px; text-align: center; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
th { background: rgba(30, 41, 59, 0.8); color: #94a3b8; font-weight: 600; }
td b { color: #38bdf8; font-size: 16px; background: rgba(56, 189, 248, 0.1); padding: 4px 12px; border-radius: 20px; }
</style>
</head>
<body>

<div class="card">
<div class="wheel-wrapper">
<div class="pointer"></div>
<div class="wheel" id="wheel"></div>
</div>

<div class="timer-card">
<div class="timer-label">পরবর্তী লাইভ ড্র:</div>
<div class="timer-display" id="timerDisplay">00:00</div>
</div>

<button class="test-btn" onclick="triggerSpin()">Instant Spin (Test)</button>
</div>

<div class="card">
<h2>📊 আজকের রেজাল্ট হিস্ট্রি</h2>
<table>
<thead>
<tr><th>সময় (Time)</th><th>নম্বর (Number)</th></tr>
</thead>
<tbody id="historyBody">
<tr><td colspan="2">কোনো রেজাল্ট পাওয়া যায়নি</td></tr>
</tbody>
</table>
</div>

<script>
const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#3b82f6', '#a855f7', '#ec4899', '#06b6d4', '#6366f1'];
let currentRotation = 0;
let isSpinning = false;

// Draw Wheel Slices & Numbers (0 to 9)
function createWheel() {
const wheel = document.getElementById("wheel");
let conicGradientStr = colors.map((color, i) => ${color} ${i * 36}deg ${(i + 1) * 36}deg).join(', '); wheel.style.background =conic-gradient(${conicGradientStr});

for (let i = 0; i < 10; i++) {
const slice = document.createElement("div");
slice.className = "slice";
slice.style.transform = rotate(${i * 36}deg); slice.innerHTML =<span class="num-text">${i}&lt;/span>;
wheel.appendChild(slice);
}
}

// Fixed 15-Minute Sync Logic (:00, :15, :30, :45)
function updateCountdown() {
const now = new Date();
const minutes = now.getMinutes();
const seconds = now.getSeconds();

const nextIntervalMinute = (Math.floor(minutes / 15) + 1) * 15;
let diffSeconds = (nextIntervalMinute * 60) - (minutes * 60 + seconds);

if (diffSeconds === 900) diffSeconds = 0; // Exactly on interval

const m = Math.floor(diffSeconds / 60);
const s = diffSeconds % 60;

document.getElementById("timerDisplay").innerText =
${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s};

// Auto spin at target exact time
if (diffSeconds === 0 && !isSpinning) {
triggerSpin();
}
}

// Spin Wheel Logic
function triggerSpin() {
if (isSpinning) return;
isSpinning = true;

// Fetch admin selected target number (default 0)
let targetNum = parseInt(localStorage.getItem("targetNumber") || "0");

// Angle Calculation for Wheel Alignment
let sliceDegree = 36;
let targetDegree = 360 - (targetNum * sliceDegree) - (sliceDegree / 2);

// Ensure positive spin turns
currentRotation += 1800 + (targetDegree - (currentRotation % 360));

const wheel = document.getElementById("wheel");
wheel.style.transform = rotate(${currentRotation}deg)`;

setTimeout(() => {
saveAndRenderHistory(targetNum);
isSpinning = false;
}, 5000);
}

// History Handling
function saveAndRenderHistory(num) {
const now = new Date();
const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

let history = JSON.parse(localStorage.getItem("gameHistory") || "[]");
history.unshift({ time: timeStr, number: num });
localStorage.setItem("gameHistory", JSON.stringify(history));

renderHistory();
}

function renderHistory() {
let history = JSON.parse(localStorage.getItem("gameHistory") || "[]");
let tbody = document.getElementById("historyBody");

if (history.length === 0) {
tbody.innerHTML = '<tr><td colspan="2">কোনো রেজাল্ট পাওয়া যায়নি</td></tr>';
return;
}

tbody.innerHTML = history.map(item =>
<tr&gt;&lt;td&gt;${item.time}</td><td><b>${item.number}</b></td></tr>`
).join('');
}

// Initializing
createWheel();
renderHistory();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
